name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        shell: bash
        run: |
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"

      - name: Unit tests
        run: zig build test

      - name: Build
        run: zig build

      - name: ZMP live benchmark
        shell: bash
        run: |
          set -euo pipefail
          ./zig-out/bin/zigmq --protocol zmp --host 127.0.0.1 --port 4222 >/tmp/zigmq-zmp-ci.log 2>&1 &
          broker_pid=$!
          trap 'status=$?; echo "--- zigmq broker log ---"; cat /tmp/zigmq-zmp-ci.log || true; kill "$broker_pid" 2>/dev/null || true; exit "$status"' EXIT
          sleep 1
          python3 scripts/benchmark_zmp.py --port 4222 --messages 16 --subscribers 1 --payload-size 128 --pipeline 1 --ack-publishes
          python3 scripts/benchmark_zmp.py --port 4222 --messages 16 --subscribers 1 --payload-size 128 --pipeline 1
          python3 scripts/benchmark_zmp.py --port 4222 --messages 16 --subscribers 10 --payload-size 128 --pipeline 1

      - name: End-to-end tests
        run: python3 scripts/e2e_test.py --binary ./zig-out/bin/zigmq

      - name: Edge feature tests
        run: python3 scripts/edge_features_test.py --binary ./zig-out/bin/zigmq

      - name: Durable stream tests
        run: python3 scripts/stream_test.py --binary ./zig-out/bin/zigmq

      - name: CLI tests
        run: python3 scripts/cli_test.py --binary ./zig-out/bin/zigmq

      - name: Python FFI test
        run: python3 scripts/python_ffi_test.py

      - name: Real-time workload scenarios
        run: python3 scripts/realtime_scenarios.py --binary ./zig-out/bin/zigmq

      - name: NATS index regression
        run: python3 scripts/nats_index_test.py --binary ./zig-out/bin/zigmq

      - name: Security hardening regression
        run: python3 scripts/security_hardening_test.py --binary ./zig-out/bin/zigmq
