name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        shell: bash
        run: |
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"

      - name: Unit tests
        run: zig build test

      - name: Build
        run: zig build

      - name: Version metadata
        run: ./zig-out/bin/zigmq --version 2>&1 | grep -F 'zigmq 1.0.0-beta.1'

      - name: Generate ephemeral mTLS test certificates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/zigmv-tls
          cd /tmp/zigmv-tls
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -keyout ca.key -out ca.crt -days 1 -subj '/CN=ZigMV CI CA' >/dev/null 2>&1
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -keyout server.key -out server.csr -subj '/CN=127.0.0.1' >/dev/null 2>&1
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 1 -sha256 >/dev/null 2>&1
          cp server.key client.key
          cp server.crt client.crt

      - name: ZigMV smoke test
        run: python3 scripts/zigmv_test.py --binary ./zig-out/bin/zigmq --port 4230

      - name: Native ZigMV benchmark and integrity check
        shell: bash
        run: |
          set -euo pipefail
          ./zig-out/bin/zigmq --protocol zigmv --host 127.0.0.1 --port 4222 >/tmp/zigmq-zigmv-ci.log 2>&1 &
          broker_pid=$!
          trap 'status=$?; echo "--- zigmq broker log ---"; cat /tmp/zigmq-zigmv-ci.log || true; kill "$broker_pid" 2>/dev/null || true; exit "$status"' EXIT
          sleep 1
          python3 scripts/benchmark_zigmv.py --port 4222 --messages 16 --payload-size 128 --drain-timeout 10 --ack-publishes

      - name: End-to-end tests
        run: python3 scripts/e2e_test.py --binary ./zig-out/bin/zigmq

      - name: Edge feature tests
        run: python3 scripts/edge_features_test.py --binary ./zig-out/bin/zigmq

      - name: Broker-to-broker edge bridge
        run: python3 scripts/edge_broker_bridge_test.py --binary ./zig-out/bin/zigmq

      - name: TLS and mTLS runtime gate
        run: python3 scripts/tls_mtls_test.py --binary ./zig-out/bin/zigmq --ca /tmp/zigmv-tls/ca.crt --server-cert /tmp/zigmv-tls/server.crt --server-key /tmp/zigmv-tls/server.key --client-cert /tmp/zigmv-tls/client.crt --client-key /tmp/zigmv-tls/client.key --port 4240

      - name: Secure edge bridge
        run: python3 scripts/secure_edge_bridge_test.py --binary ./zig-out/bin/zigmq --ca /tmp/zigmv-tls/ca.crt --cert /tmp/zigmv-tls/server.crt --key /tmp/zigmv-tls/server.key --port-a 4241 --port-b 4242

      - name: Durable stream tests
        run: python3 scripts/stream_test.py --binary ./zig-out/bin/zigmq

      - name: Persistent session recovery
        run: python3 scripts/session_recovery_test.py --binary ./zig-out/bin/zigmq --port 4231

      - name: Prometheus metrics endpoint
        run: python3 scripts/metrics_test.py --binary ./zig-out/bin/zigmq --broker-port 4232 --metrics-port 9092

      - name: CLI tests
        run: python3 scripts/cli_test.py --binary ./zig-out/bin/zigmq

      - name: Python FFI test
        run: python3 scripts/python_ffi_test.py

      - name: Real-time workload scenarios
        run: python3 scripts/realtime_scenarios.py --binary ./zig-out/bin/zigmq

      - name: NATS index regression
        run: python3 scripts/nats_index_test.py --binary ./zig-out/bin/zigmq

      - name: Security hardening regression
        run: python3 scripts/security_hardening_test.py --binary ./zig-out/bin/zigmq

      - name: Hostile input resilience
        run: python3 scripts/protocol_hostile_input_test.py --binary ./zig-out/bin/zigmq --port 4243

      - name: Release gate consistency
        run: python3 scripts/release_gate_check.py --root . --expected-version 1.0.0-beta.1

  cross-target-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-aarch64-musl
            target: aarch64-linux-musl
          - name: linux-armv7-musleabihf
            target: arm-linux-musleabihf
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Zig 0.15.2
        shell: bash
        run: |
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
      - name: Build ${{ matrix.name }} ReleaseSafe
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
      - name: Build ${{ matrix.name }} ReleaseFast
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast
      - name: Verify artifact exists
        run: test -x zig-out/bin/zigmq
