name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.2.0-beta.1"
        required: true
        type: string
      target:
        description: "Branch or commit to release"
        required: true
        default: main
        type: string
      prerelease:
        description: "Mark the release as a prerelease"
        required: true
        default: false
        type: boolean
      custom_notes:
        description: "Optional maintainer notes to place at the top of the release notes"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0

      - name: Install Zig 0.15.2
        shell: bash
        run: |
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"

      - name: Validate release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION"
            echo "Use a semantic version such as v0.2.0 or v0.2.0-beta.1"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_VERSION" >/dev/null; then
            echo "Tag already exists: $RELEASE_VERSION"
            exit 1
          fi
          zig build test
          zig build -Doptimize=ReleaseFast
          expected_version="${RELEASE_VERSION#v}"
          actual_version="$(./zig-out/bin/zigmq --version 2>&1 | awk '{print $2}')"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "Binary version $actual_version does not match release $expected_version"
            exit 1
          fi

      - name: Package release build
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          mkdir -p dist
          cp zig-out/bin/zigmq dist/zigmq
          cp README.md LICENSE dist/
          tar -C dist -czf "zigmq-${version}-linux-x86_64.tar.gz" zigmq README.md LICENSE
          sha256sum "zigmq-${version}-linux-x86_64.tar.gz" > "zigmq-${version}-linux-x86_64.tar.gz.sha256"

      - name: Generate categorized release notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
          CUSTOM_RELEASE_NOTES: ${{ inputs.custom_notes }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "$TARGET_SHA" 2>/dev/null || true)"
          export TARGET_SHA PREVIOUS_TAG
          if [[ -f "docs/RELEASE_${RELEASE_VERSION#v}.md" ]]; then
            cp "docs/RELEASE_${RELEASE_VERSION#v}.md" release_notes.md
            printf '\n---\n\n## Commit summary\n\n' >> release_notes.md
            bash .github/scripts/generate-release-notes.sh >> release_notes.md
          else
            bash .github/scripts/generate-release-notes.sh > release_notes.md
          fi
          cat release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=("$RELEASE_VERSION" "--target" "$RELEASE_TARGET" "--title" "$RELEASE_VERSION" "--notes-file" release_notes.md)
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            args+=("--prerelease")
          fi
          gh release create "${args[@]}" dist/*.tar.gz dist/*.sha256
