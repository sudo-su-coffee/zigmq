name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.2.0"
        required: true
        type: string
      target:
        description: "Branch or commit to release"
        required: true
        default: main
        type: string
      prerelease:
        description: "Mark the release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0

      - name: Install Zig 0.15.2
        shell: bash
        run: |
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"

      - name: Validate release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION"
            echo "Use a semantic version such as v0.2.0 or v0.2.0-rc.1"
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_VERSION" >/dev/null; then
            echo "Tag already exists: $RELEASE_VERSION"
            exit 1
          fi
          zig build test
          zig build -Doptimize=ReleaseFast

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=("$RELEASE_VERSION" "--target" "$RELEASE_TARGET" "--title" "$RELEASE_VERSION" "--generate-notes")
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            args+=("--prerelease")
          fi
          gh release create "${args[@]}"
